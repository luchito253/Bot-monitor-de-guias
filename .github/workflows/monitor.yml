name: Monitor de Guia Coordinadora

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

jobs:
  check-status:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar script
        env:
          bot_telegram: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          id_chat: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Guardar estado actualizado
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "chore: actualizar estado de guia"
          file_pattern: "estado_guia.json"
