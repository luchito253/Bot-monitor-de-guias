name: Bot de Rastreo de Guías

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  rastrear_guias:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar script de rastreo
        run: python bot.py

      - name: Guardar nuevo estado (Commit)
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add estado_guias.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Actualizar estado de guias" && git push)
